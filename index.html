<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- A11y Announcer (Hanya dibaca oleh Screen Reader) -->
    <div id="a11y-announcer" class="sr-only" aria-live="polite"></div>

    <header role="banner">
        <h1>ToDo list Website</h1>
        <button id="theme-toggle" aria-label="Toggle Light or Dark Mode">Toggle Dark Mode</button>
    </header>

    <div class="layout-container">
        <!-- Panel Kiri: Task List -->
        <main class="left-panel" role="main">
            <section class="todo-list-container" aria-labelledby="list-heading">
                <h2 id="list-heading">Task List</h2>
                <ul class="todo-list" id="todo-list" aria-live="polite">
                    <!-- List digenerate oleh JS -->
                </ul>
            </section>
        </main>

        <!-- Panel Kanan: Detail & Form -->
        <aside class="right-panel" role="complementary">
            <section class="todo-detail-container" aria-labelledby="detail-heading">
                <h2 id="detail-heading">Task Details</h2>
                <div class="detail-card" id="task-detail-card" aria-live="polite">
                    <p><em>Click a task name to view details</em></p>
                </div>
            </section>

            <section class="todo-form-container" aria-labelledby="form-heading">
                <h2 id="form-heading">Create / Edit Task</h2>
                <form id="todo-form" action="#" method="POST" aria-label="Task Form">
                    <div class="form-group">
                        <label for="task_name">Task Name:</label>
                        <input type="text" id="task_name" name="task_name" required aria-required="true">
                    </div>
                    <div class="form-group">
                        <label for="task_description">Description:</label>
                        <textarea id="task_description" name="task_description" rows="3" required aria-required="true"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="task_deadline">Due Date:</label>
                        <input type="date" id="task_deadline" name="task_deadline" required aria-required="true">
                    </div>
                    <!-- CRITERIA 2: Media Capture API -->
                    <div class="form-group">
                        <label for="task_image">Attachment (Camera/Image):</label>
                        <input type="file" id="task_image" name="task_image" accept="image/*" capture="environment">
                    </div>
                    <!-- CRITERIA 3: Notification Time Field -->
                    <div class="form-group">
                        <label for="task_notif">Notification Time:</label>
                        <input type="datetime-local" id="task_notif" name="task_notif">
                    </div>
                    <button type="submit" id="submit-btn" aria-label="Submit Task">Add Task</button>
                </form>
            </section>
        </aside>
    </div>

    <footer role="contentinfo">
        <p>&copy; 2026 The Style Warrior - Todo List</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
