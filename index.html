<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ToDo list Website</h1>
        <button id="theme-toggle">Toggle Dark Mode</button>
    </header>

    <div class="layout-container">
        <main class="left-panel">
            <section class="todo-list-container">
                <h2>Task List</h2>
                <ul class="todo-list" id="todo-list">
                </ul>
            </section>
        </main>

        <aside class="right-panel">
            <section class="todo-detail-container">
                <h2>Task Details</h2>
                <div class="detail-card" id="task-detail-card">
                    <p><em>Click a task name to view details</em></p>
                </div>
            </section>

            <section class="todo-form-container">
                <h2>Create / Edit Task</h2>
                <form id="todo-form" action="#" method="POST">
                    <div class="form-group">
                        <label for="task_name">Task Name:</label>
                        <input type="text" id="task_name" name="task_name" required>
                    </div>
                    <div class="form-group">
                        <label for="task_description">Description:</label>
                        <textarea id="task_description" name="task_description" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="task_deadline">Due Date:</label>
                        <input type="date" id="task_deadline" name="task_deadline" required>
                    </div>
                    <button type="submit" id="submit-btn">Add Task</button>
                </form>
            </section>
        </aside>
    </div>

    <footer>
        <p>&copy; Pemrograman Web</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
