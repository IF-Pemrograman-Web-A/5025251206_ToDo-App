<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ToDo list Website</h1>
    </header>

    <div class="layout-container">
        <main class="left-panel">
            <section class="todo-list-container">
                <h2>Task List</h2>
                <ul class="todo-list">
                    <li>
                        <strong>KPPL</strong>
                        <button type="button">Delete</button><br>
                        <small>Due: September 20, 2026</small>
                    </li>
                    <li>
                        <strong>PBO</strong>
                        <button type="button">Delete</button><br>
                        <small>Due: September 25, 2026</small>
                    </li>
                    <li>
                        <strong>PWEB</strong>
                        <button type="button">Delete</button><br>
                        <small>Due: September 27, 2026</small>
                    </li>
                </ul>
            </section>
        </main>

        <aside class="right-panel">
            <section class="todo-detail-container">
                <h2>Task Details</h2>
                <div class="detail-card">
                    <h3>PWEB</h3>
                    <p><strong>Status:</strong> In Progress</p>
                    <p><strong>Due:</strong> September 14, 2026</p>
                    <p>Tugas E01a membuat website todo list</p>
                </div>
            </section>

            <section class="todo-form-container">
                <h2>Create New Task</h2>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="task_name">Task Name:</label>
                        <input type="text" id="task_name" name="task_name" required>
                    </div>
                    <div class="form-group">
                        <label for="task_description">Description:</label>
                        <textarea id="task_description" name="task_description" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="task_deadline">Due Date:</label>
                        <input type="date" id="task_deadline" name="task_deadline" required>
                    </div>
                    <button type="submit">Add Task</button>
                </form>
            </section>
        </aside>
    </div>

    <footer>

    </footer>

</body>
</html>
